version: '3.9'

services:
  # ─────────────────────────────
  # Backend API
  # ─────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ailc_backend
    environment:
      - ENVIRONMENT=development
      - DEMO_MODE=true
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - CORS_ORIGINS=http://localhost:3000
      - DATABASE_URL=sqlite:///./data/ai_learning_conductor.db
      - LOG_LEVEL=INFO
    ports:
      - "8000:8000"
    volumes:
      # Persist SQLite database between container restarts
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ─────────────────────────────
  # Frontend (development only)
  # For production, build and serve via Vercel/Nginx
  # ─────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: ailc_frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - VITE_API_BASE_URL=
      - VITE_DEMO_MODE=true
      - VITE_ENVIRONMENT=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_data:
    driver: local
